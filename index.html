<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFBF2" />
    <meta name="description" content="Belajar kosakata bahasa Mandarin dengan flashcard, kuis, dan sahabat panda." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Panda Belajar Mandarin" />
    <meta property="og:description" content="Belajar kosakata Mandarin dengan flashcard, kuis, dan sahabat panda." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Panda Belajar Mandarin" />
    <meta name="twitter:description" content="Belajar kosakata Mandarin dengan flashcard, kuis, dan sahabat panda." />
    <!-- Untuk pratinjau gambar di media sosial, tambahkan: <meta property="og:image" content="https://DOMAIN-ANDA/og-image.png" /> -->
    <title>Panda Belajar Mandarin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Terapkan tema sebelum render agar tidak berkedip
      try {
        var s = JSON.parse(localStorage.getItem('pbm:settings:v1') || '{}');
        var d = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
